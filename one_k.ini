# one_k_tensor.ini — native CLASS run matching one_k_tensor.ipynb common_settings
# Run:  ./class one_k_tensor.ini
# Outputs land in output/one_k_tensor_00_*

root = output/one_k_

# -------- cosmology (Planck 2018 TT,TE,EE+lowE) --------
h = 0.6688
omega_b = 0.02212
# frac = 1 - 1e-6 of omega_cdm shifted to VFDM
Omega_cdm = 2.696216604473341e-07
N_ncdm = 0
Omega_fld = 0
Omega_vf = 0.26962139082567366

tau_reio = 0.05522
YHe = BBN
recombination = RECFAST

A_s = 2.092e-9
n_s = 0.962

# -------- VFDM --------
attractor_ic_vf = yes
svt_coupling = no
vf_tuning_index = 3
vector_background_mode = bianchi
vf_parameters = 1.e-25, 1.e-16, 1.e-30, 0.01
gamma_Ak = 1.5707963267948966

# -------- perturbations --------
modes = s
ic = ad
gauge = synchronous
output = tCl,pCl,dTk,mPk
P_k_max_h/Mpc = 40
tol_perturbations_integration = 1e-8

#tensor_approach = wkb 

# k-modes to dump as perturbations_kN_s.dat
k_output_values = 0.0001, 1.
#k_output_values = 1

# -------- I/O --------
write_background = yes
write_thermodynamics = no
write_primordial = no
write_parameters = yeap

perturbations_verbose = 3