# one_k_lcdm.ini — LCDM counterpart to one_k.ini (no VFDM, all dark matter in CDM).
# Run:  ./class one_k_lcdm.ini
# Outputs land in output/one_k_lcdm_00_*
#
# `compute_lcdm_tensor` is left unset → no scalar-file h_+ columns (off by default).

root = output/one_k_lcdm_

# -------- cosmology (Planck 2018 TT,TE,EE+lowE) --------
h = 0.6688
omega_b = 0.02212
Omega_cdm = 0.26962139082567366
N_ncdm = 0
Omega_fld = 0
Omega_vf = 0.0

tau_reio = 0.05522
YHe = BBN
recombination = RECFAST

A_s = 2.092e-9
n_s = 0.962

# -------- perturbations --------
modes = s
ic = ad
gauge = synchronous
output = tCl,pCl,dTk,mPk
P_k_max_h/Mpc = 40
tol_perturbations_integration = 1e-8

# k-modes to dump as perturbations_kN_s.dat
k_output_values = 0.0001, 1.

# -------- I/O --------
write_background = yes
write_thermodynamics = no
write_primordial = no
write_parameters = yeap

perturbations_verbose = 3
