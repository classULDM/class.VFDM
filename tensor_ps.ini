# tensor_ps.ini — template for the Tensor_power_spectrum_transfer plots.
# Reproduces run_vfdm_transfer() from the old notebook via the native binary.
#
# Column layout of output/<root>_tk.dat (1-indexed, with VFDM + svt_coupling):
#   1:k (h/Mpc)  2:d_g  3:d_b  4:d_cdm  5:d_ur  6:d_vf  7:h_+  8:dh_+  9:h_x  10:dh_x  ...
#
# Rerun recipe (four VFDM masses + one LCDM scalar path):
#
#   # VFDM — edit `root` and `vf_mass` before each run:
#   root = output/tensor_ps_m23_   ; vf_mass = 1.e-23 ; ./class tensor_ps.ini
#   root = output/tensor_ps_m24_   ; vf_mass = 1.e-24 ; ./class tensor_ps.ini
#   root = output/tensor_ps_m25_   ; vf_mass = 1.e-25 ; ./class tensor_ps.ini
#   root = output/tensor_ps_m26_   ; vf_mass = 1.e-26 ; ./class tensor_ps.ini
#
#   # LCDM scalar-path (comment out the VFDM block, uncomment the LCDM one below).
#
# The LCDM tensor-sector ("neutrino damping") curve cannot be produced by the
# native binary — output_tk() hardcodes the scalar mode. Reuse the existing
# PS_tensor/*_LCDM_t_transfer.npz from an earlier classy run.

root = output/tensor_ps_m25_BIS   # edit before each run

# -------- cosmology (Planck 2018 TT,TE,EE+lowE) --------
h = 0.6688
omega_b = 0.02212
# frac = 1 - 1e-6 of omega_cdm shifted to VFDM
Omega_cdm = 2.696216604473341e-07
N_ncdm = 0
Omega_fld = 0


tau_reio = 0.05522
YHe = BBN
recombination = RECFAST

A_s = 2.092e-9
n_s = 0.962

# -------- VFDM --------
attractor_ic_vf = yes
svt_coupling = yes
vector_background_mode = bianchi
vf_mass = 1.e-25
vf_theta_ini = 1.e-16
vf_omega_ini_factor = 1.e-30
# vf_shooting_parameter is auto-tuned by the shooting method when Omega_vf is set;
# only specify it here if you set Omega0_vf directly (no shooting).
gamma_Ak = 1.5707963267948966
Omega_vf = 0.26962139082567366

# -------- perturbations --------
modes = s
ic = ad
gauge = synchronous
output = tCl,pCl,dTk,mPk
P_k_max_h/Mpc = 130
tol_perturbations_integration = 1e-8

# fine k-sampling (matches run_vfdm_transfer in the original notebook)
k_scalar_step_sub = 0.01
k_scalar_step_super = 0.001
k_per_decade_for_bao = 500.
k_scalar_k_per_decade_for_pk = 500.
k_per_decade_for_pk = 500.

# -------- I/O --------
write_background = no
write_thermodynamics = no
write_primordial = no
write_parameters = yeap

# ============================================================
# LCDM scalar-path alternative — comment out the VFDM block
# above (Omega_cdm / Omega_vf / attractor_ic_vf / svt_coupling /
# vector_background_mode / vf_mass / vf_theta_ini /
# vf_omega_ini_factor / vf_shooting_parameter / gamma_Ak)
# and uncomment the block below, then:
#   root = output/tensor_ps_LCDM_s_   ;   ./class tensor_ps.ini
# ============================================================
#
#Omega_cdm = 0.26962139082567366
#Omega_vf = 0.0
#compute_lcdm_tensor = yes
#root = output/tensor_ps_LCDM_s_

#
perturbations_verbose = 3